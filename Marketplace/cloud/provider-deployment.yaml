apiVersion: v1
kind: ConfigMap
metadata:
  name: models-config
data:
  models-config.json: |-
    {
      "$schema": "./internal/config/models-config-schema.json",
      "models": [
        {
          "modelId": "0x5781caf0457ceda99459aa9f8a86b98675b45fa27788b9a058c5c184e640065e",
          "modelName": "llama2",
          "apiType": "openai",
          "apiUrl": "https://9079161191267303424.us-central1-fasttryout.prediction.vertexai.goog/v1/projects/101868473812/locations/us-central1/endpoints/9079161191267303424",
          "apiKey": "19dcf7e801e37e40e078d639cfeab6c7a3403ce0"
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
data:
  proxy.conf: |
    proxy:yosz9BZCuu7Rli7mYe4G1JbIO0Yprvwl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cookie-template
data:
  .cookie: |
    proxy:yosz9BZCuu7Rli7mYe4G1JbIO0Yprvwl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider
  template:
    metadata:
      labels:
        app: provider
    spec:
      volumes:
        - name: provider-data
          persistentVolumeClaim:
            claimName: provider-data
        - name: models-config
          configMap:
            name: models-config
        - name: proxy-config
          configMap:
            name: proxy-config
        - name: cookie-config
          configMap:
            name: cookie-template
        - name: config-dir
          emptyDir: {}
      initContainers:
        - name: init-config
          image: busybox
          command: ['sh', '-c', 'mkdir -p /app/data && mkdir -p /app/config && cp /proxy-config/proxy.conf /app/config/proxy.conf && chmod 600 /app/config/proxy.conf && cp /cookie-config/.cookie /app/config/.cookie && chmod 600 /app/config/.cookie']
          volumeMounts:
            - name: proxy-config
              mountPath: /proxy-config
            - name: cookie-config
              mountPath: /cookie-config
            - name: config-dir
              mountPath: /app/config
            - name: provider-data
              mountPath: /app/data
      containers:
        - name: provider
          image: ${REGISTRY}/${PROVIDER_IMAGE_NAME}:${VERSION}
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          ports:
            - containerPort: 3333
              name: provider
            - containerPort: 8082
              name: health
          env:
            # Wallet configuration
            - name: WALLET_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-secrets
                  key: wallet-private-key

            # Contract and blockchain configuration
            - name: DIAMOND_CONTRACT_ADDRESS
              value: "${DIAMOND_CONTRACT_ADDRESS}"
            - name: MOR_TOKEN_ADDRESS
              value: "${MOR_TOKEN_ADDRESS}"
            - name: EXPLORER_API_URL
              value: "${EXPLORER_API_URL}"
            - name: ETH_NODE_CHAIN_ID
              value: "${ETH_NODE_CHAIN_ID}"
            - name: ENVIRONMENT
              value: "${ENVIRONMENT}"
            - name: BLOCKSCOUT_API_URL
              value: "${EXPLORER_API_URL}"
            - name: ETH_NODE_ADDRESS
              value: "${ETH_NODE_ADDRESS}"

            # Service configuration
            - name: PROXY_ADDRESS
              value: "0.0.0.0:3333"
            - name: WEB_ADDRESS
              value: "0.0.0.0:8082"
            - name: WEB_PUBLIC_URL
              value: "http://35.227.134.166:8082"
            - name: MODELS_CONFIG_PATH
              value: "${MODELS_CONFIG_PATH}"
            - name: ETH_NODE_USE_SUBSCRIPTIONS
              value: "${ETH_NODE_USE_SUBSCRIPTIONS}"
            - name: ETH_NODE_LEGACY_TX
              value: "${ETH_NODE_LEGACY_TX}"
            - name: PROXY_STORE_CHAT_CONTEXT
              value: "true"
            - name: PROXY_STORAGE_PATH
              value: "${PROXY_STORAGE_PATH}"
            - name: LOG_COLOR
              value: "true"
            
            # Authentication configuration - use environment variables instead of paths
            - name: COOKIE_CONTENT
              value: "proxy:yosz9BZCuu7Rli7mYe4G1JbIO0Yprvwl"
            - name: AUTH_CONFIG_FILE_PATH
              value: "/app/config/proxy.conf"
            - name: COOKIE_FILE_PATH
              value: "/app/config/.cookie"

          volumeMounts:
            - name: provider-data
              mountPath: /app/data
            - name: models-config
              mountPath: /app/data/models-config.json
              subPath: models-config.json
            - name: config-dir
              mountPath: /app/config
        - name: debug
          image: busybox
          command: ["sleep", "3600"]
          volumeMounts:
            - name: config-dir
              mountPath: /app/config
            - name: provider-data
              mountPath: /app/data